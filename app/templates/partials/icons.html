{#
  Line icons, drawn inline so they take the text colour and stay sharp at
  any size. Every icon is decorative -- it always sits beside a word that
  says the same thing -- so each one is hidden from screen readers.
#}
{% macro icon(name, class="icon") %}
<svg class="{{ class }}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
     aria-hidden="true" focusable="false">
  {%- if name == "home" -%}
    <path d="M4 11 12 4l8 7"/><path d="M6 9.5V20h12V9.5"/><path d="M10 20v-5h4v5"/>
  {%- elif name == "calendar" -%}
    <rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>
  {%- elif name == "sliders" -%}
    <path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>
  {%- elif name == "login" -%}
    <path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="m9 16 4-4-4-4"/><path d="M13 12H4"/>
  {%- elif name == "logout" -%}
    <path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="m15 16 4-4-4-4"/><path d="M19 12H9"/>
  {%- elif name == "coffee" -%}
    <path d="M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"/><path d="M16 10.5h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8 3.5v2M11 3.5v2M14 3.5v2"/>
  {%- elif name == "play" -%}
    <path d="M8 5.5v13l10.5-6.5z"/>
  {%- elif name == "clock" -%}
    <circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>
  {%- elif name == "chevron-left" -%}
    <path d="m15 5-7 7 7 7"/>
  {%- elif name == "chevron-right" -%}
    <path d="m9 5 7 7-7 7"/>
  {%- elif name == "chevron-down" -%}
    <path d="m6 9 6 6 6-6"/>
  {%- elif name == "check" -%}
    <path d="m5 12.5 4.5 4.5L19 7.5"/>
  {%- elif name == "flag" -%}
    <path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/>
  {%- elif name == "sun" -%}
    <circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.5 12h-2M21.5 12h-2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>
  {%- elif name == "moon" -%}
    <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>
  {%- elif name == "power" -%}
    <path d="M12 3v8"/><path d="M7 6.5a7 7 0 1 0 10 0"/>
  {%- elif name == "plus" -%}
    <path d="M12 5v14M5 12h14"/>
  {%- elif name == "x" -%}
    <path d="M6 6l12 12M18 6 6 18"/>
  {%- elif name == "alert" -%}
    <path d="M12 4 2.5 20h19z"/><path d="M12 10v4M12 17h.01"/>
  {%- elif name == "pencil" -%}
    <path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/>
  {%- endif -%}
</svg>
{% endmacro %}
