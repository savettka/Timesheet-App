{% for c in sync_conflicts %}
<div class="flash flash-warning conflict" role="alert">
  <svg class="flash-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <path d="M12 4 2.5 20h19z"/><path d="M12 10v4M12 17h.01"/>
  </svg>
  <div class="flash-text">
    <p><strong>{{ c.date.strftime('%a %d %b') }}</strong> was changed on this PC and on the web while
      they were apart. STM kept the newer version, from {{ 'this PC' if c.kept == 'app' else 'the web' }}.</p>
    <div class="conflict-actions">
      <form method="post" action="{{ url_for('desktop.settle', conflict_id=c.id) }}">
        <input type="hidden" name="choice" value="other">
        <button type="submit" class="btn btn-sm btn-secondary">
          Use the {{ 'web' if c.kept == 'app' else "PC's" }} version instead</button>
      </form>
      <form method="post" action="{{ url_for('desktop.settle', conflict_id=c.id) }}">
        <input type="hidden" name="choice" value="keep">
        <button type="submit" class="btn btn-sm btn-ghost">Keep this one</button>
      </form>
    </div>
  </div>
</div>
{% endfor %}
